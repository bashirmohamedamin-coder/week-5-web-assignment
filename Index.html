      <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Dashboard</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>SpendWise</h2>

            <nav>
                <ul>
                    <li>🏠 Dashboard</li>
                    <li>💰 Expenses</li>
                    <li>📊 Reports</li>
                    <li>🎯 Savings</li>
                    <li>⚙ Settings</li>
                </ul>
            </nav>
        </aside>

        <!-- Main Area -->
        <main class="main-content">

            <!-- Header -->
            <header class="header">
                <h1>Financial Overview</h1>
                <p>September 2026</p>
            </header>

            <!-- Cards -->
            <section class="cards">

                <div class="card" tabindex="0">
                    <h3>🍔 Food</h3>
                    <p>Ksh 9,500</p>
                </div>

                <div class="card" tabindex="0">
                    <h3>🚌 Transport</h3>
                    <p>Ksh 2,800</p>
                </div>

                <div class="card" tabindex="0">
                    <h3>🏠 Rent</h3>
                    <p>Ksh 18,000</p>
                </div>

                <div class="card" tabindex="0">
                    <h3>🎬 Entertainment</h3>
                    <p>Ksh 3,200</p>
                </div>

                <div class="card" tabindex="0">
                    <h3>💵 Savings</h3>
                    <p>Ksh 25,000</p>
                </div>

                <div class="card" tabindex="0">
                    <h3>💡 Utilities</h3>
                    <p>Ksh 3,500</p>
                </div>

            </section>

        </main>

    </div>

</body>
<script src="script.js"></script>
</body>
</html>
